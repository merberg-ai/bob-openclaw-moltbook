name: Offline baseline and backup tests

on:
  push:
    paths:
      - 'scripts/inventory_live_host.py'
      - 'scripts/inventory_service_topology.py'
      - 'scripts/inventory_windows_startup.ps1'
      - 'scripts/reconcile_dev_checkout.py'
      - 'scripts/backup_live_sqlite.py'
      - 'scripts/stage_live_sources.py'
      - 'scripts/audit_staged_sources.py'
      - 'scripts/review_staged_sources.py'
      - 'scripts/prepare_source_candidate.py'
      - 'scripts/import_verified_sources.py'
      - 'tests/test_inventory_live_host.py'
      - 'tests/test_inventory_service_topology.py'
      - 'tests/test_reconcile_dev_checkout.py'
      - 'tests/test_backup_live_sqlite.py'
      - 'tests/test_stage_live_sources.py'
      - 'tests/test_audit_staged_sources.py'
      - 'tests/test_review_staged_sources.py'
      - 'tests/test_prepare_source_candidate.py'
      - 'tests/test_import_verified_sources.py'
      - 'tests/test_live_source_regression.py'
      - 'src/**'
      - '.github/workflows/inventory-tests.yml'
  pull_request:
    paths:
      - 'scripts/inventory_live_host.py'
      - 'scripts/inventory_service_topology.py'
      - 'scripts/inventory_windows_startup.ps1'
      - 'scripts/reconcile_dev_checkout.py'
      - 'scripts/backup_live_sqlite.py'
      - 'scripts/stage_live_sources.py'
      - 'scripts/audit_staged_sources.py'
      - 'scripts/review_staged_sources.py'
      - 'scripts/prepare_source_candidate.py'
      - 'scripts/import_verified_sources.py'
      - 'tests/test_inventory_live_host.py'
      - 'tests/test_inventory_service_topology.py'
      - 'tests/test_reconcile_dev_checkout.py'
      - 'tests/test_backup_live_sqlite.py'
      - 'tests/test_stage_live_sources.py'
      - 'tests/test_audit_staged_sources.py'
      - 'tests/test_review_staged_sources.py'
      - 'tests/test_prepare_source_candidate.py'
      - 'tests/test_import_verified_sources.py'
      - 'tests/test_live_source_regression.py'
      - 'src/**'
      - '.github/workflows/inventory-tests.yml'

permissions:
  contents: read

jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline synthetic baseline and backup tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  windows-startup-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows startup inventory PowerShell syntax (no execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = Join-Path $PWD 'scripts/inventory_windows_startup.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'PowerShell syntax valid; no startup tasks or registry keys touched.'
