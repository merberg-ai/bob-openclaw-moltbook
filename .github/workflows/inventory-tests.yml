permissions:
  contents: read

jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline synthetic baseline and backup tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build integrated v0.7.1 manager candidate from pinned baseline
        run: python3 scripts/build_v071_manager_candidate.py
      - name: Rehearse versioned v0.7.1 UI package and code-only rollback
        run: python3 scripts/rehearse_v071_ui_update.py
      - name: Smoke read-only browser preview (synthetic data, disabled POST)
        run: python3 scripts/preview_v071_ui.py --self-test
      - name: Preserve historical 9-file baseline rehearsal only when exact baseline matches
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from import_verified_sources import SOURCES
          root = Path("src")
          current = {
              folder + "/" + item.name
              for folder in ("bin", "lib/bob")
              for item in (root / folder).iterdir()
              if item.is_file()
          }
          matching = current == set(SOURCES) and all(
              hashlib.sha256((root / name).read_bytes()).hexdigest() == sha
              for name, sha in SOURCES.items()
          )
          if matching:
              subprocess.run([sys.executable, "scripts/rehearse_release_rollout.py"], check=True)
          else:
              print("SKIP historical nine-file rehearsal: repository has advanced beyond v0.7.0.")
              print("Its SHA-pinned baseline checks remain unchanged and runnable on original baseline.")
          PY
      - name: Build current queue-management dashboard release candidate
        run: python3 scripts/build_v072_dashboard_manage_candidate.py
      - name: Run inert service-graph acceptance in disposable sandbox
        run: python3 scripts/stage_service_graph.py
      - name: Verify inert staging unit syntax
        run: python3 scripts/verify_inert_stage_units.py
      - name: Verify inert mock crash, restart and rollback lifecycle
        run: python3 scripts/rehearse_inert_process_lifecycle.py

  windows-startup-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows startup inventory PowerShell syntax (no execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = Join-Path $PWD 'scripts/inventory_windows_startup.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'PowerShell syntax valid; no startup tasks or registry keys touched.'
